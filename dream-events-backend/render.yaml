services:
  # Managed PostgreSQL Database
  - type: db
    name: dream-events-db
    databaseName: dreamevents
    user: postgres
    plan: free

  # Java Spring Boot API Web Service (via Docker)
  - type: web
    name: dream-events-api
    runtime: docker
    plan: free
    dockerfilePath: Dockerfile
    dockerContext: .
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      # Link connection url from database service
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: dream-events-db
          property: connectionString
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: dream-events-db
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: dream-events-db
          property: password
      # JWT Authentication Key
      - key: JWT_SECRET
        generateValue: true
      # Cloudinary Properties (User should set these in Render Dashboard)
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      # Admin Credentials Settings (User should set these in Render Dashboard)
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        value: AdminPass123!
      - key: ADMIN_EMAIL
        value: admin@dreamevents.com
      - key: OWNER_NOTIFICATION_EMAIL
        value: owner@dreamevents.com
      # SMTP Mail Settings (User should set these in Render Dashboard)
      - key: SPRING_MAIL_HOST
        sync: false
      - key: SPRING_MAIL_PORT
        value: 587
      - key: SPRING_MAIL_USERNAME
        sync: false
      - key: SPRING_MAIL_PASSWORD
        sync: false
