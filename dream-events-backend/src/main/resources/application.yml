spring:
  profiles:
    active: dev
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  datasource:
    hikari:
      minimum-idle: 2
      maximum-pool-size: 10
      idle-timeout: 300000        # 5 minutes
      max-lifetime: 600000        # 10 minutes (keep connections fresh)
      connection-timeout: 10000   # 10 seconds (fail fast instead of hanging)
      keepalive-time: 30000       # 30 seconds (keep connections active to Supabase)
      validation-timeout: 5000    # 5 seconds
  jpa:
    open-in-view: false
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        show_sql: false
  sql:
    init:
      mode: always

# Cloudinary Config (overridden in prod/dev env properties)
cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:}
  api-key: ${CLOUDINARY_API_KEY:}
  api-secret: ${CLOUDINARY_API_SECRET:}

